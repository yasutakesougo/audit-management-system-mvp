name: CSP Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure manual offline runtime
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cat <<'OFFLINE_ENV' >> "$GITHUB_ENV"
          VITE_E2E=0
          VITE_E2E_MSAL_MOCK=1
          VITE_SKIP_LOGIN=1
          VITE_SKIP_SHAREPOINT=1
          VITE_FORCE_SHAREPOINT=0
          VITE_DATA_PROVIDER=memory
          VITE_DEMO_MODE=1
          VITE_FORCE_DEMO=1
          VITE_FEATURE_SCHEDULES_SP=0
          VITE_FEATURE_SCHEDULES_GRAPH=0
          VITE_SCHEDULES_SAVE_MODE=mock
          VITE_MSAL_CLIENT_ID=dummy
          VITE_MSAL_TENANT_ID=dummy
          VITE_SP_RESOURCE=https://contoso.sharepoint.com
          VITE_SP_SITE_RELATIVE=/sites/Audit
          VITE_SP_SCOPE_DEFAULT=https://contoso.sharepoint.com/AllSites.Read
          NOTIFY_WEBHOOK_URL=
          TEAMS_WEBHOOK_URL=
          VITE_TELEMETRY_URL=
          OFFLINE_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:csp
      - name: Upload CSP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csp-reports
          path: csp-reports/**
          retention-days: 7
