name: Label Schema Changes

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number whose head matches the selected branch'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    # 必要ならパスで事前フィルタ（任意）
    # paths:
    #   - 'provision/**'
    #   - 'docs/**'

# 403 対策：必要最小の権限を明示付与
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ github.event_name == 'workflow_dispatch' && 'label (PR only)' || 'label' }}
    runs-on: ubuntu-latest
    steps:
      - name: Add `schema` label when schema-related files changed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request payload; skipping.');
              return;
            }

            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const number = pr.number;

            // 変更ファイルを取得（ページネーション対応）
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: number, per_page: 100 }
            );

            // スキーマ変更とみなすパターンをここで定義
            // 例：provision 配下、または docs 下の *.schema.json / schema.json
            const schemaMatchers = [
              /^provision\//,
              /^docs\/.*\.schema\.json$/i,
              /^docs\/schema\.json$/i
            ];

            const touchedSchema = files.some(f =>
              schemaMatchers.some(rx => rx.test(f.filename))
            );

            if (!touchedSchema) {
              core.info('No schema-related changes detected; nothing to label.');
              return;
            }

            const LABEL = 'schema';

            // ラベルが無ければ作成（存在すれば 422 が返るので握りつぶす）
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: '0e8a16',
                description: 'PR touches provisioning/schema files'
              });
              core.info(`Label '${LABEL}' created (or already exists).`);
            } catch (e) {
              if (e.status === 422) {
                core.info(`Label '${LABEL}' already exists.`);
              } else {
                core.warning(`createLabel failed (ignored): ${e.message}`);
              }
            }

            // PR にラベルを付与
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels: [LABEL]
            });

            core.info(`Label '${LABEL}' added to PR #${number}.`)

  label-manual:
    name: label
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Validate schema label without mutation
      uses: actions/github-script@v7
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        script: |
          const raw = process.env.PR_NUMBER ?? '';
          if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
            core.setFailed('PR number must be a positive safe integer.');
            return;
          }
          const { owner, repo } = context.repo;
          const pull_number = Number(raw);
          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
          if (pr.state !== 'open' || pr.base.ref !== 'main'
              || pr.head.repo?.full_name !== `${owner}/${repo}` || pr.head.sha !== context.sha) {
            core.setFailed('Select an open main PR from this repository with head.sha equal to the workflow SHA.');
            return;
          }
          const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
          const schemaMatchers = [/^provision\//, /^docs\/.*\.schema\.json$/i, /^docs\/schema\.json$/i];
          const touchedSchema = files.some(f => schemaMatchers.some(rx => rx.test(f.filename)));
          if (touchedSchema && !pr.labels.some(label => label.name === 'schema')) {
            core.setFailed('Schema changes require an existing schema label; manual validation never modifies labels.');
            return;
          }
          const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number });
          if (current.head.sha !== context.sha || current.state !== 'open') {
            core.setFailed('PR changed during validation.');
            return;
          }
          core.info(`Read-only schema label validation passed for PR #${pull_number} at ${context.sha}.`);
